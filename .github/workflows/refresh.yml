name: refresh-dashboards

# Every 15 minutes, rebuild every dashboard's data.json from the ONE shared source, rr-metrics:
#   data  = rapidhsg/rr-metrics-data, branch "data" (AccuLynx sends, refreshed every 15 min)
#   rules = rapidhsg/rr-metrics-data, branch "main" (locked metric rules)
# rr-metrics-data also starts this right after each new pull (workflow_dispatch).
# Each dashboard builds on its own: if one fails, the others still publish and the failed one keeps
# its last good numbers. The job then turns red and an alert is emailed.
#
# Repo secrets:
#   RR_METRICS_READ_TOKEN  read-only token for rapidhsg/rr-metrics-data (required once it is private)
#   RESEND_API_KEY         failure alert emails (optional)

on:
  schedule:
    - cron: "2,17,32,47 * * * *" # every 15 min, a few minutes after each rr-metrics pull
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the rr-metrics rules (main)
        uses: actions/checkout@v4
        with:
          repository: rapidhsg/rr-metrics-data
          ref: main
          path: .rrm
          sparse-checkout: rules
          token: ${{ secrets.RR_METRICS_READ_TOKEN || github.token }}

      - name: Get the rr-metrics data (data)
        uses: actions/checkout@v4
        with:
          repository: rapidhsg/rr-metrics-data
          ref: data
          path: .rrd
          token: ${{ secrets.RR_METRICS_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas

      - name: Build RR1 (thermometer)
        id: rr1
        continue-on-error: true
        env:
          RRM_RULES: .rrm/rules
          RRM_DATA: .rrd/data
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python rr1/build.py

      - name: Build RR2 (scoreboard)
        id: rr2
        continue-on-error: true
        env:
          RRM_RULES: .rrm/rules
          RRM_DATA: .rrd/data
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python rr2/build.py

      - name: Build Rep Board
        id: repboard
        continue-on-error: true
        env:
          RRM_RULES: .rrm/rules
          RRM_DATA: .rrd/data
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python rep-board/build.py

      - name: Publish the new numbers (only if changed)
        run: |
          git config user.name "dashboards[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rr1/data.json rr2/data.json rep-board/data.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --quiet
            git push
          fi

      - name: Turn red if any dashboard failed
        if: steps.rr1.outcome == 'failure' || steps.rr2.outcome == 'failure' || steps.repboard.outcome == 'failure'
        run: |
          echo "RR1: ${{ steps.rr1.outcome }} | RR2: ${{ steps.rr2.outcome }} | Rep Board: ${{ steps.repboard.outcome }}"
          exit 1
